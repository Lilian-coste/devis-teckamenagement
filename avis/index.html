<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les avis de nos clients — Teck Aménagement</title>
<meta name="description" content="Les avis Google des clients de Teck Aménagement, dans leur intégralité, avec le lien vers chacun d'eux sur Google.">
<link rel="icon" href="../pergola/page-accueil/assets/logo-teck.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<!--
  ═══════════════════════════════════════════════════════════════════════════
  LA PAGE DE TOUS LES AVIS
  ═══════════════════════════════════════════════════════════════════════════

  Demandée par Lilian le 12/09/2026, pour que le mail de preuve sociale envoie sur
  une page de Teck plutôt que sur la fiche Google. Deux raisons, et il les a dites
  dans cet ordre : la fiche Google montre aussi les deux avis à une étoile qui
  portent sur un produit qui n'est pas celui de Franck, et une page tenue par nous
  se présente mieux.

  ⚠️ LES DEUX AVIS ÉCARTÉS SONT ÉCARTÉS POUR UNE RAISON, PAS PAR CONFORT. Sandrine
  Ciano et Jean-Christophe Ciano portent sur une terrasse composite de marque
  Millboard, qui n'est pas un produit de Teck. L'avis à quatre étoiles, lui, est
  publié : écarter un avis positif parce qu'il n'est pas parfait reviendrait à
  maquiller la note, et la note affichée serait alors fausse.

  ── D'OÙ VIENT LE DESSIN ───────────────────────────────────────────────────
  De l'enregistrement d'écran de Lilian du 12/09/2026, où il commente les deux
  formes existantes et dit ce qu'il garde de chacune :
   · du bandeau défilant ....... les étoiles bleues en haut à gauche, le texte
                                 aligné à gauche, la phrase surlignée en bleu,
                                 la pastille d'initiales, la mention 4,9★
   · du bloc « parlent de nous » le survol : la carte se soulève et son contour
                                 passe au bleu Teck
   · de Google .................. « Plus » sous un avis long, qui ouvre le texte
                                 entier et jamais un extrait figé
   · du site de Teck ............ le bouton noir en capitales, celui de
                                 « VOIR TOUS NOS PROJETS »

  ⚠️ NI ITALIQUE, NI GUILLEMETS. Lilian, mot pour mot : « je veux pas que ce soit en
  italique, parce que ce n'est pas très beau, et je ne veux même pas qu'il y ait de
  guillemets ». Les cartes des autres pages en portent encore, et les guillemets y
  ont été retirés le même jour, à sa demande.

  ⚠️ LE TEXTE DES AVIS N'EST JAMAIS COUPÉ. Un avis long s'affiche replié, mais le
  texte entier est déjà dans la page : « on laisse le début, on écrit voir plus, et
  on ne prend pas qu'une seule partie, on laisse tout l'avis ». Couper pour de bon,
  ce serait réécrire quelqu'un.

  ⚠️ LES INITIALES PARTOUT, FAUTE DE PHOTOS. L'export Google ne porte aucune photo
  de profil. Le champ `avatar` existe dans `avis.json` et la page s'en sert dès
  qu'il est rempli : rien d'autre à changer le jour où on les a.

  ── LA MATIÈRE ─────────────────────────────────────────────────────────────
  `avis.json`, fabriqué par
  ~/mes-clients/teck-amenagement/livrables/avis/preparer-avis.py
  ⚠️ NE PAS ÉDITER `avis.json` À LA MAIN : la prochaine exécution du script
  l'écrase. Un avis se corrige à la source, dans l'export, ou dans la liste
  `APRES_EXPORT` du script.
-->

<style>
  :root{
    --teck:#0653A8;
    --ink:#1D1D1F;
    --fond:#f8f8f8;
    --gris:#86868B;
    --trait:#D2D2D7;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow-x:hidden; max-width:100%; }
  body{
    background:var(--fond); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; }

  /* ══════════════ L'EN-TÊTE ══════════════ */
  .entete{ text-align:center; padding:30px 20px 0; }
  .entete .logo{ display:block; margin:0 auto; width:100%; max-width:300px; height:auto; }
  @media(min-width:768px){ .entete .logo{ max-width:460px; } }
  .entete .surtitre{
    margin:22px 0 0; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--teck); font-weight:600;
  }
  .entete h1{
    font-size:30px; font-weight:500; letter-spacing:-.02em; margin:10px 0 0; color:var(--ink);
  }
  @media(min-width:768px){ .entete h1{ font-size:40px; } }
  .note-globale{
    display:inline-flex; align-items:center; gap:7px;
    margin:16px 0 0; padding:9px 16px;
    background:#fff; border:1px solid var(--trait); border-radius:999px;
    font-size:14px; font-weight:600; color:var(--ink);
    box-shadow:0 4px 16px rgba(0,0,0,.04);
  }
  .note-globale .etoiles{ color:var(--teck); letter-spacing:1px; font-size:13px; }
  .note-globale .muted{ font-weight:400; color:var(--gris); }

  /* ══════════════ LA MOSAÏQUE ══════════════
     Trois colonnes indépendantes, remplies par le script. Des colonnes CSS
     (`column-count`) auraient été plus courtes à écrire, mais elles recomposent
     toute la page dès qu'une carte s'ouvre : le lecteur qui déplie un avis verrait
     tout le reste sauter. Ici, ouvrir une carte ne déplace que sa colonne. */
  /* ⚠️ DES RANGÉES, PAS TROIS COLONNES IDENTIQUES (Lilian, 12/09/2026 : « tout est
     aligné pareil, ça fait mal à la tête »). La page reprend le rythme du bloc
     « Parlent de nous » : une grande carte avec sa photo et une phrase en grand, deux
     petites à côté, puis une rangée de trois. Une carte vedette toutes les trois
     rangées, tant qu'il reste des avis dont on connaît la photo du chantier. */
  .mosaique{ max-width:1240px; margin:0 auto; padding:48px 22px 10px; }
  .rangee{ display:grid; gap:32px; align-items:start; grid-template-columns:1fr; }
  .rangee + .rangee{ margin-top:32px; }
  @media(min-width:700px){ .rangee{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1060px){ .rangee{ grid-template-columns:1fr 1fr 1fr; } }
  /* La vedette occupe deux colonnes dès qu'il y en a plus d'une. */
  @media(min-width:700px){ .vedette{ grid-column:span 2; } }
  .pile{ display:flex; flex-direction:column; gap:32px; }

  /* ══════════════ UNE CARTE ══════════════ */
  /* ⚠️ LE DESSIN VIENT DU BLOC « PARLENT DE NOUS » des pages de résultat, que Lilian
     préfère nettement (12/09/2026) : rayon de 48 px, beaucoup d'air, et des photos de
     chantier posées entre les avis. Mêmes valeurs de survol, au pixel : la carte se
     soulève de 8 px et son contour passe au bleu Teck. */
  .carte{
    background:#fff; border:1px solid #E5E7EB; border-radius:3rem;
    padding:38px 34px 32px; display:flex; flex-direction:column;
    box-shadow:0 4px 15px rgba(0,0,0,.03);
    transition:all .5s cubic-bezier(.2,.8,.2,1);
  }
  .carte:hover{ transform:translateY(-8px); border-color:var(--teck); box-shadow:0 20px 40px rgba(0,0,0,.06); }

  /* ⚠️ LES PHOTOS NE SONT RATTACHÉES À AUCUN AVIS, et c'est délibéré. Les 34 photos
     que des clients avaient jointes à leurs avis Google ne sont plus téléchargeables,
     leurs adresses signées ont expiré. Poser une photo de chantier à côté d'un avis
     pris au hasard reviendrait à affirmer que cette personne parle de ce projet-là.
     Elles vivent donc dans leur propre carte, sans légende et sans nom. */
  /* ⚠️ LA PHOTO EST CELLE DU CHANTIER DE LA PERSONNE, jamais une illustration posée
     là. Les trois paires viennent du bloc « Parlent de nous », où elles sont validées
     depuis longtemps. Une photo à côté d'un avis affirme que cette personne parle de
     ce chantier : pas de photo sans certitude. Cf. `VEDETTES` dans le préparateur. */
  .carte.vedette{ padding:0; overflow:hidden; }
  .carte.vedette .visuel{ display:block; aspect-ratio:16/10; overflow:hidden; }
  .carte.vedette .visuel img{ display:block; width:100%; height:100%; object-fit:cover; }
  .carte.vedette .dedans{ padding:34px 40px 32px; display:flex; flex-direction:column; }
  @media(max-width:600px){ .carte.vedette .dedans{ padding:28px 26px 26px; } }
  /* Les étoiles et la phrase mise en avant sont centrées, comme dans le bloc d'origine.
     Le corps de l'avis reste à gauche : certains font mille caractères, et mille
     caractères centrés ne se lisent plus. */
  .carte.vedette .etoiles{ text-align:center; margin-bottom:16px; }
  .carte.vedette .titre{
    font-size:25px; line-height:1.25; font-weight:500; letter-spacing:-.01em;
    color:var(--ink); text-align:center; margin:0 0 20px; text-wrap:balance;
  }
  @media(min-width:1060px){ .carte.vedette .titre{ font-size:31px; } }
  .carte .etoiles{ color:var(--teck); font-size:13px; letter-spacing:1px; margin-bottom:12px; }

  /* Ni italique ni guillemets, demande de Lilian du 12/09/2026. */
  .carte .texte{
    color:#424245; font-size:15px; line-height:1.7; font-weight:300;
    margin:0; white-space:pre-line;
  }
  /* Le surlignage bleu, jamais un soulignement : c'est la forme retenue pour Teck. */
  /* Les valeurs viennent de `components/reviews/ReviewText.tsx`, côté quiz : c'est la
     même encre et le même fond partout où un avis est surligné chez Teck. */
  .carte .texte mark{
    background:rgba(6,83,168,.09); color:rgba(10,31,68,1);
    padding:1px 4px; border-radius:4px;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }
  /* Replié : six lignes. Le texte entier est déjà là, c'est la hauteur qui change,
     jamais le contenu. */
  .carte .texte.replie{
    display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .voir-plus{
    align-self:flex-start; margin-top:10px; padding:0;
    background:none; border:0; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--teck);
    font-family:inherit;
  }
  .voir-plus:hover{ text-decoration:underline; }
  .voir-plus:focus-visible{ outline:2px solid var(--teck); outline-offset:3px; border-radius:3px; }

  .pied-carte{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:18px; padding-top:16px; border-top:1px solid #EDEDF0;
  }
  .qui{ display:flex; align-items:center; gap:10px; min-width:0; }
  .ava{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:#F5F5F7; border:1px solid var(--trait);
    display:flex; align-items:center; justify-content:center;
    color:var(--teck); font-size:11px; font-weight:700;
    object-fit:cover; overflow:hidden;
  }
  .qui .nom{ font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Petit, noir, souligné : c'est la forme demandée, et elle se lit comme un lien
     sans crier plus fort que le nom juste au-dessus. */
  .qui .lien-google{
    display:inline-block; margin-top:2px;
    font-size:11px; color:#000; text-decoration:underline; text-underline-offset:2px;
  }
  .qui .lien-google:hover{ color:var(--teck); }
  .mention{
    flex-shrink:0; text-align:right; font-size:12.5px; font-weight:600; color:var(--ink);
    line-height:1.35;
  }
  .mention .ystar{ color:#FBBF24; }
  .mention .muted{ display:block; font-weight:400; color:var(--gris); font-size:11px; }

  /* ══════════════ LE BOUTON, CELUI DU SITE ══════════════
     ⚠️ C'EST LE LIEN « ↗ Plus de projets » DE teckamenagement.fr, pas le pavé noir
     (Lilian, 12/09/2026, capture à l'appui). Ni fond, ni cadre : une flèche fine, du
     texte espacé, et c'est tout. Le pavé plein faisait bouton de formulaire au bas
     d'une page qui, elle, est tenue au calme. */
  .zone-bouton{ text-align:center; padding:40px 20px 60px; }
  .bouton-avis{
    display:inline-flex; align-items:center; gap:14px;
    background:none; border:0; padding:6px 4px; cursor:pointer;
    font-family:inherit; font-size:21px; font-weight:500; letter-spacing:.14em;
    color:var(--ink); text-decoration:none; line-height:1;
  }
  @media(max-width:600px){ .bouton-avis{ font-size:18px; letter-spacing:.1em; } }
  .bouton-avis .fleche{
    font-size:.92em; font-weight:400; line-height:1;
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .bouton-avis:hover .fleche{ transform:translate(3px,-3px); }
  .bouton-avis:focus-visible{ outline:2px solid var(--teck); outline-offset:4px; }
  .reste{ display:block; margin-top:12px; font-size:13px; color:var(--gris); }

  /* ══════════════ LA PRESSE ══════════════ */
  .marquee{ overflow:hidden; width:100%; }
  .mq-track{ display:flex; width:max-content; gap:16px; align-items:center; }
  .mq-right{ animation:scrollRight 40s linear infinite; }
  .marquee:hover .mq-track{ animation-play-state:paused; }
  @keyframes scrollRight{ from{transform:translateX(-50%);} to{transform:translateX(0);} }
  /* ⚠️ PAS DE BLANC PLEIN ICI (Lilian, 12/09/2026 : « ne mets pas un fond full
     blanc »). Sur les pages de résultat, le bandeau presse est blanc parce qu'il sépare
     deux sections colorées. Ici il n'y a rien après lui, et un pavé blanc de cent
     pixels sous une page grise se lit comme une coupure. Il reste donc transparent, la
     plage grise descend jusqu'au pied de page. */
  .press-section{ background:transparent; padding:44px 0 56px; }
  .press-ttl{ text-align:center; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--teck); font-weight:600; margin-bottom:34px; }
  .press-section .marquee{ max-width:780px; margin:0 auto;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent 100%); }
  .press-track{ gap:52px; align-items:center; padding:0 25px; }
  .press-track img{ width:auto; object-fit:contain; display:block; mix-blend-mode:multiply; flex-shrink:0; }
  .press-track .elle{ height:52px; }
  .press-track .cotesud{ height:54px; }
  .press-track .ideat{ height:50px; }
  .press-track .cotemag{ height:40px; }
  .press-track .ab{ height:60px; }
  .press-track .anous{ height:42px; }
  .press-track .artdeco{ height:42px; }
  .press-logotext{ font-family:'Playfair Display',Georgia,serif; font-size:36px; font-weight:700; color:var(--ink); line-height:1; white-space:nowrap; }

  /* ══════════════ LE PIED DE PAGE ══════════════ */
  .footer{ background:#FFFFFF; text-align:center; padding:24px 16px 24px; }
  .footer img{ display:block; margin:0 auto 10px; width:100%; max-width:334px; height:auto; }
  @media (min-width:768px){ .footer img{ max-width:540px; } }
  .footer .legal{ font-size:13px; color:#000; }
  .footer .legal a{ color:#000; font-style:italic; text-decoration:none; }
  .footer .legal .sep{ color:#C7C7CC; margin:0 8px; }

  @media (prefers-reduced-motion: reduce){
    .carte{ transition:none; }
    .mq-right{ animation:none; }
    .bouton-avis{ transition:none; }
  }
</style>
</head>
<body>

<header class="entete">
  <img class="logo" src="../pergola/page-accueil/assets/logo-teck.png" alt="Teck Aménagement">
  <p class="surtitre">Les avis de nos clients</p>
  <h1>Ce qu'ils disent de leur projet</h1>
  <div class="note-globale">
    <span class="etoiles">★★★★★</span>
    <span>4,9<span class="muted">/5</span></span>
    <span class="muted">·</span>
    <span class="muted">+140 avis Google</span>
  </div>
</header>

<main class="mosaique" id="mosaique" aria-live="polite">
  <!-- Les colonnes et les cartes sont écrites par le script, depuis avis.json -->
</main>

<div class="zone-bouton">
  <button class="bouton-avis" id="plusDavis" type="button"><span class="fleche" aria-hidden="true">&#8599;</span>Plus d'avis</button>
  <span class="reste" id="reste"></span>
</div>

<section class="press-section">
  <div class="press-ttl">Vu dans la presse</div>
  <div class="marquee">
    <div class="mq-track mq-right press-track" id="pressTrack">
      <img class="artdeco" src="../pergola/page-accueil/assets/presse/art-decoration.png" alt="Art&amp;Décoration">
      <img class="elle" src="../pergola/page-accueil/assets/presse/elle-decoration.png" alt="Elle Décoration">
      <img class="cotesud" src="../pergola/page-accueil/assets/presse/cote-sud.png" alt="Maisons Côté Sud">
      <img class="ideat" src="../pergola/page-accueil/assets/presse/ideat.png" alt="IDEAT">
      <img class="cotemag" src="../pergola/page-accueil/assets/presse/cote-magazine.png" alt="Côté Magazine">
      <img class="ab" src="../pergola/page-accueil/assets/presse/architecture-bois.png" alt="Architecture Bois">
      <img class="anous" src="../pergola/page-accueil/assets/presse/anous.png" alt="ANous Aix Marseille">
      <span class="press-logotext" style="font-weight:600;">Décoration</span>
    </div>
  </div>
</section>

<footer class="footer">
  <img src="../pergola/page-accueil/assets/logo-teck.png" alt="Teck Aménagement — Pergola, terrasse, mobilier en bois exotique">
  <div class="legal">
    <a href="https://teckamenagement.fr/mentions-legales/">Politique de confidentialité</a>
    <span class="sep">·</span>© Teck Aménagement. Tous droits réservés.
  </div>
</footer>

<script>
(function(){
  'use strict';

  /* Une fournée, c'est quatre rangées : la page en montre douze à quatorze avis à la
     fois. La première version en posait quinze d'un coup, tous de la même taille, et
     Lilian l'a dit sans détour : « ça fait mal à la tête ». */
  var RANGEES_PAR_FOURNEE = 4;
  var SEUIL_REPLI = 420;  /* au-delà, la carte s'ouvre avec « Voir plus » */
  /* ⚠️ OÙ TOMBENT LES RANGÉES À PHOTO, par leur numéro (la première est la rangée 0).
     Le défaut serait une rangée vedette toutes les trois, et c'est encore ce qui se passe
     au-delà de cette liste. Mais Lilian a déplacé la troisième à la main le 12/09/2026 :
     « remonte de deux lignes l'avis de Anne Marie Spencer ». Sa rangée passe donc de la 6
     à la 4, juste après celle de Karine Parra.
     Pour redéplacer une carte vedette, il suffit de changer un numéro ici ; les deux avis
     qui l'accompagnent, eux, se choisissent dans `TETE` (préparateur des avis). */
  var VEDETTE_AUX_RANGEES = [0, 3, 4];
  var VEDETTE_TOUTES_LES = 3;

  var mosaique = document.getElementById('mosaique');
  var bouton = document.getElementById('plusDavis');
  var reste = document.getElementById('reste');

  var VEDETTES = [];   /* les avis qui ont une photo et une phrase mise en avant */
  var SIMPLES = [];    /* tous les autres */
  var poseesV = 0, poseesS = 0, rangees = 0;

  function elem(balise, classe, texte){
    var e = document.createElement(balise);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = texte;
    return e;
  }

  /* ⚠️ AUCUN HTML VENU D'UN AVIS N'EST INJECTÉ. Le texte est écrit par un client, pas
     par nous : il passe par `textContent` et par des nœuds, jamais par une chaîne de
     balises. Le surlignage est fabriqué en découpant le texte en trois morceaux. */
  /* ⚠️ PLUSIEURS PASSAGES, PAS UN SEUL (Lilian, 12/09/2026) : un avis court en porte
     un, un avis long jusqu'à quatre. Le découpage se fait dans l'ordre du texte, et
     chaque morceau passe par `textContent` : aucun HTML venu d'un avis n'est injecté. */
  function texteAvec(avis){
    var p = elem('p', 'texte');
    var t = avis.texte;
    var liste = (avis.surlignes || []).filter(function(s){ return s && t.indexOf(s) !== -1; });
    if (!liste.length){ p.textContent = t; return p; }

    /* On les range par position pour découper d'une seule traite, de gauche à droite. */
    liste.sort(function(a, b){ return t.indexOf(a) - t.indexOf(b); });

    var curseur = 0;
    liste.forEach(function(s){
      var i = t.indexOf(s, curseur);
      if (i === -1) return;                 /* déjà couvert par un passage précédent */
      if (i > curseur) p.appendChild(document.createTextNode(t.slice(curseur, i)));
      p.appendChild(elem('mark', null, s));
      curseur = i + s.length;
    });
    if (curseur < t.length) p.appendChild(document.createTextNode(t.slice(curseur)));
    return p;
  }

  function pied(avis){
    var pied = elem('div', 'pied-carte');
    var qui = elem('div', 'qui');
    var ava;
    if (avis.avatar){
      ava = elem('img', 'ava');
      ava.src = avis.avatar; ava.alt = ''; ava.loading = 'lazy';
    } else {
      ava = elem('div', 'ava', avis.initiales);
      ava.setAttribute('aria-hidden', 'true');
    }
    qui.appendChild(ava);

    var bloc = elem('div');
    bloc.appendChild(elem('div', 'nom', avis.nom));
    if (avis.lien){
      var a = elem('a', 'lien-google', 'Voir l\u2019avis sur Google');
      a.href = avis.lien; a.target = '_blank'; a.rel = 'noopener noreferrer';
      bloc.appendChild(a);
    }
    qui.appendChild(bloc);
    pied.appendChild(qui);

    var men = elem('div', 'mention');
    men.appendChild(document.createTextNode('4,9'));
    men.appendChild(elem('span', 'ystar', '\u2605'));
    men.appendChild(document.createTextNode('/5'));
    men.appendChild(elem('span', 'muted', '+140 avis'));
    pied.appendChild(men);
    return pied;
  }

  function repli(p, ou){
    if (p.textContent.length <= SEUIL_REPLI) return;
    p.classList.add('replie');
    var b = elem('button', 'voir-plus', 'Voir plus');
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', function(){
      var ouvert = p.classList.toggle('replie') === false;
      b.textContent = ouvert ? 'Voir moins' : 'Voir plus';
      b.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
    });
    ou.appendChild(b);
  }

  function carteSimple(avis){
    var c = elem('article', 'carte');
    var et = elem('div', 'etoiles', '\u2605\u2605\u2605\u2605\u2605'.slice(0, avis.note));
    et.setAttribute('aria-label', avis.note + ' étoiles sur 5');
    c.appendChild(et);
    var p = texteAvec(avis);
    c.appendChild(p);
    repli(p, c);
    c.appendChild(pied(avis));
    return c;
  }

  function carteVedette(avis){
    var c = elem('article', 'carte vedette');

    var visuel = elem('figure', 'visuel');
    visuel.style.margin = '0';
    var img = elem('img');
    img.src = 'photos/' + avis.photo;
    img.alt = 'Le chantier de ' + avis.nom + ', réalisé par Teck Aménagement';
    img.loading = 'lazy';
    img.decoding = 'async';
    visuel.appendChild(img);
    c.appendChild(visuel);

    var dedans = elem('div', 'dedans');
    var et = elem('div', 'etoiles', '\u2605\u2605\u2605\u2605\u2605'.slice(0, avis.note));
    et.setAttribute('aria-label', avis.note + ' étoiles sur 5');
    dedans.appendChild(et);
    /* Le titre est une phrase de l'avis, recopiée telle quelle. Cf. `VEDETTES` dans le
       préparateur : aucune n'est écrite par nous. */
    if (avis.titre) dedans.appendChild(elem('h2', 'titre', avis.titre));
    var p = texteAvec(avis);
    dedans.appendChild(p);
    repli(p, dedans);
    dedans.appendChild(pied(avis));
    c.appendChild(dedans);
    return c;
  }

  function rangeeVedette(){
    var r = elem('div', 'rangee');
    r.appendChild(carteVedette(VEDETTES[poseesV++]));
    var pile = elem('div', 'pile');
    for (var k = 0; k < 2 && poseesS < SIMPLES.length; k++){
      pile.appendChild(carteSimple(SIMPLES[poseesS++]));
    }
    r.appendChild(pile);
    mosaique.appendChild(r);
  }

  function rangeeSimple(){
    var r = elem('div', 'rangee');
    for (var k = 0; k < 3 && poseesS < SIMPLES.length; k++){
      r.appendChild(carteSimple(SIMPLES[poseesS++]));
    }
    mosaique.appendChild(r);
  }

  function fournee(){
    for (var n = 0; n < RANGEES_PAR_FOURNEE; n++){
      if (poseesS >= SIMPLES.length && poseesV >= VEDETTES.length) break;
      var apres = VEDETTE_AUX_RANGEES[VEDETTE_AUX_RANGEES.length - 1];
      var vedette = poseesV < VEDETTES.length &&
                    (VEDETTE_AUX_RANGEES.indexOf(rangees) !== -1 ||
                     (rangees > apres && (rangees - apres) % VEDETTE_TOUTES_LES === 0));
      if (vedette) rangeeVedette(); else rangeeSimple();
      rangees += 1;
    }
    var manque = (VEDETTES.length - poseesV) + (SIMPLES.length - poseesS);
    if (manque <= 0){
      bouton.style.display = 'none';
      reste.textContent = 'Vous avez vu les ' + (VEDETTES.length + SIMPLES.length) + ' avis publiés ici';
    } else {
      reste.textContent = 'Encore ' + manque + ' avis';
    }
  }

  bouton.addEventListener('click', fournee);

  fetch('avis.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      d.forEach(function(a){ (a.photo ? VEDETTES : SIMPLES).push(a); });
      fournee();
    })
    .catch(function(){
      reste.textContent = 'Les avis n\u2019ont pas pu être chargés. Rechargez la page.';
      bouton.style.display = 'none';
    });

  /* Le bandeau presse boucle sans couture : on duplique sa piste. */
  var t = document.getElementById('pressTrack');
  var copie = t.cloneNode(true);
  while (copie.firstChild){ t.appendChild(copie.firstChild); }
})();
</script>
</body>
</html>
