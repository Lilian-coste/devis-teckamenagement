<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teck Aménagement — Réserver votre appel</title>
    <meta name="robots" content="noindex">

    <!-- PAS de pixel Meta ici, volontairement.
         L'événement Lead est tiré par la page de résultat, au chargement. Le poser aussi
         ici doublerait le signal qui pilote les campagnes payantes de Franck, à chaque
         fois qu'un prospect clique sur le bouton. Même règle que /rdv-mail/. -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f8f8f8;
            font-family: 'Inter', sans-serif;
            color: #1d1d1f;
        }
        .bandeau-diagnostic {
            background: #0653A8;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            padding: 14px 20px;
        }
        /* Remonté le 16/08/2026, comme le hero de la page de résultat. */
        .tete {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 20px 8px;
            text-align: center;
        }
        /* Logo agrandi le 15/08/2026 (Lilian) : 260px se perdait sur la page. */
        .tete img { width: 360px; max-width: 82%; height: auto; margin-bottom: 28px; }
        .tete h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin: 0 0 14px;
        }
        .tete p {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 300;
            color: #4b5563;
            margin: 0;
        }
        .calendrier-zone { padding: 16px 16px 48px; }
        #calendrier { margin: 0 auto; max-width: 1024px; min-width: 320px; height: 720px; }
        @media (max-width: 768px) {
            .bandeau-diagnostic { font-size: 14px; padding: 12px 16px; }
            .tete { padding: 16px 16px 4px; }
            .tete h1 { font-size: 24px; }
            #calendrier { height: 900px; }
        }
    </style>
</head>
<body>

    <div class="bandeau-diagnostic">
        Diagnostic réservé aux propriétaires ayant un projet de pergola sur mesure.
    </div>

    <div class="tete">
        <img src="../../561d79a-47b15060-85cc2f7b/images/logo-teck.png" alt="Teck Aménagement">
        <h1>Réservez votre appel</h1>
        <p>Choisissez le créneau qui vous convient le mieux ci-dessous :</p>
    </div>

    <div class="calendrier-zone">
        <div id="calendrier"></div>
    </div>

    <!-- Calendly : suivi de la source (séquence mail site / meta). Repris À L'IDENTIQUE
         de la page de résultat, d'où le widget a déménagé le 15/08/2026. Les boutons de
         la page de résultat recopient les paramètres de leur URL sur ce lien, donc
         ?source=meta arrive bien jusqu'ici. -->
    <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js"></script>
    <script>
        (function () {
            // Lit ?source=site ou ?source=meta dans l'URL (défaut : site).
            function initCalendly() {
                var params  = new URLSearchParams(window.location.search);
                var isMeta  = params.get('source') === 'meta';
                var origine = isMeta ? 'Réseaux sociaux' : 'Site internet';

                Calendly.initInlineWidget({
                    url: 'https://calendly.com/teckamenagement/30min?hide_gdpr_banner=1',
                    parentElement: document.getElementById('calendrier'),
                    prefill: {
                        // a2 = 2e question de l'event : "Comment avez-vous connu Teck Aménagement ?"
                        // Pré-remplie selon la source -> apparaît dans la notif + le Google Agenda de Franck.
                        // (Si tu changes l'ordre des questions dans Calendly, préviens-moi : a1=1re, a2=2e, etc.)
                        customAnswers: { a2: origine }
                    },
                    utm: {
                        // Filet de sécurité invisible, consultable dans le tableau de bord Calendly.
                        utmSource: isMeta ? 'meta' : 'site',
                        utmMedium: 'email',
                        utmCampaign: 'sequence-bienvenue'
                    }
                });
            }
            if (window.Calendly) { initCalendly(); }
            else { window.addEventListener('load', initCalendly); }
        })();
    </script>

</body>
</html>
