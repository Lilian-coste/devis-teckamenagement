<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teck Aménagement — Réserver votre appel</title>
    <meta name="robots" content="noindex">

    <!-- ==========================================================================
         LA PAGE DE RÉSERVATION DE LA SÉQUENCE MAIL.

         ⚠️ CE QU'ELLE ÉTAIT AVANT LE 02/09/2026 : une longue page de vente, avec un
         hero, les avis « Parlent de nous », le triptyque Créez / Révolutionnez / Vivez,
         un bandeau défilant, un pied de page, et le calendrier tout en bas. Elle est
         dans l'historique git si on la veut de nouveau.

         Décision de Lilian, 02/09/2026 : la séquence renvoie désormais sur LA MÊME page
         que le tunnel, celle où il n'y a que le calendrier. Quelqu'un qui reçoit un mail
         de relance a déjà lu nos arguments ; le lui refaire lire avant de lui montrer les
         créneaux ne fait que retarder le seul geste qu'on lui demande.

         ⚠️ C'EST UNE COPIE, PAS UNE REDIRECTION, ET C'EST TOUT L'INTÉRÊT.
         Le contenu est identique à `apercu-resultat/reserver/index.html`, mais l'adresse
         diffère. Comme chacune des deux pages étiquette ses réservations avec sa propre
         campagne UTM, on sait pour chaque rendez-vous pris s'il vient de la séquence mail
         ou du tunnel. Une redirection aurait tout mélangé.

              /rdv-mail/                    → utmCampaign « sequence-bienvenue »
              /apercu-resultat/reserver/    → utmCampaign « tunnel-quiz »

         ⚠️ SI TU MODIFIES CETTE PAGE, MODIFIE L'AUTRE. Elles doivent rester jumelles :
         c'est leur seule raison d'être. Seul le bloc `utm` du script diffère.

         PAS de pixel Meta ici, volontairement. L'événement Lead est tiré par la page de
         résultat. Le poser aussi ici doublerait le signal qui pilote les campagnes
         payantes de Franck.
         ========================================================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f8f8f8;
            font-family: 'Inter', sans-serif;
            color: #1d1d1f;
        }
        .bandeau-prequalification {
            background: #0653A8;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            padding: 14px 20px;
        }
        /* Remonté le 16/08/2026, comme le hero de la page de résultat. */
        .tete {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 20px 8px;
            text-align: center;
        }
        /* Logo agrandi le 15/08/2026 (Lilian) : 260px se perdait sur la page. */
        .tete img { width: 360px; max-width: 82%; height: auto; margin-bottom: 28px; }
        .tete h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin: 0 0 14px;
        }
        .tete p {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 300;
            color: #4b5563;
            margin: 0;
        }
        /* Mention 4,9★ — composant et valeurs repris À L'IDENTIQUE de la page de
           résultat, où il vit déjà sous chacun des quatre boutons.
           ⚠️ « +140 avis » est sourcé et vérifié : ne jamais l'arrondir. */
        .rating { display: flex; align-items: center; gap: 0; font-size: 13px; font-weight: 600; justify-content: center; color: #86868B; margin-top: 18px; }
        .rating .ystar { color: #FBBF24; font-size: 1em; line-height: 1; margin: 0; }
        .rating .muted { font-weight: 400; opacity: .85; }
        .calendrier-zone { padding: 16px 16px 48px; }
        /* ⚠️ `min-height` ET PAS `height` (27/08/2026). Calendly écrit lui-même une
           hauteur en style en ligne sur ce bloc, à chaque changement de vue, et il faut
           le laisser faire : c'est ce qui règle le blocage décrit plus bas, dans le
           script. Une hauteur fixe ici l'empêcherait de grandir. */
        #calendrier { margin: 0 auto; max-width: 1024px; min-width: 320px; min-height: 720px; }
        @media (max-width: 768px) {
            .bandeau-prequalification { font-size: 14px; padding: 12px 16px; }
            .tete { padding: 16px 16px 4px; }
            .tete h1 { font-size: 24px; }
            #calendrier { min-height: 900px; }
        }
    </style>
</head>
<body>

    <!-- Même bandeau que la page de résultat, même texte, validé mot pour mot par
         Lilian le 27/08/2026. -->
    <div class="bandeau-prequalification">
        Conception et estimation réservées aux propriétaires ayant un projet de pergola sur mesure
    </div>

    <div class="tete">
        <img src="images/logo-teck.png" alt="Teck Aménagement">
        <h1>Réservez votre appel</h1>
        <p>Choisissez le créneau qui vous convient le mieux ci-dessous :</p>
        <div class="rating"><b>4,9</b><span class="ystar">★</span><span class="muted">/5 · +140 avis</span></div>
    </div>

    <div class="calendrier-zone">
        <div id="calendrier"></div>
    </div>

    <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js"></script>
    <script>
        (function () {
            // Lit ?source=site ou ?source=meta dans l'URL (défaut : site).
            // Les liens des séquences Brevo portent déjà ce paramètre.
            function initCalendly() {
                var params  = new URLSearchParams(window.location.search);
                var isMeta  = params.get('source') === 'meta';
                var origine = isMeta ? 'Réseaux sociaux' : 'Site internet';

                Calendly.initInlineWidget({
                    url: 'https://calendly.com/teckamenagement/30min?hide_gdpr_banner=1',
                    parentElement: document.getElementById('calendrier'),
                    /* ⚠️ `resize: true` RÈGLE LE BLOCAGE DU DÉFILEMENT SUR TÉLÉPHONE.
                       Sans lui, le cadre du calendrier est plus court que son contenu, le
                       contenu prend son propre défilement, et sur iOS un doigt posé dedans
                       ne fait plus jamais bouger la page. Avec l'option, le widget applique
                       au bloc parent la hauteur réelle de sa page à chaque changement de
                       vue. Il vaut `false` par défaut dans widget.js : ne pas le retirer.
                       (Cette page ne l'avait pas avant le 02/09/2026, elle avait donc le
                       bug ; il a été corrigé sur la page du tunnel le 27/08.) */
                    resize: true,
                    prefill: {
                        // a2 = 2e question de l'event : "Comment avez-vous connu Teck Aménagement ?"
                        // Pré-remplie selon la source -> apparaît dans la notif + le Google Agenda de Franck.
                        // (Si tu changes l'ordre des questions dans Calendly, préviens-moi : a1=1re, a2=2e, etc.)
                        customAnswers: { a2: origine }
                    },
                    utm: {
                        /* ⚠️ C'EST CE BLOC, ET LUI SEUL, QUI DISTINGUE CETTE PAGE DE SA
                           JUMELLE. `utmCampaign` répond à la question « la personne
                           vient-elle de la séquence mail ? » dans le tableau de bord
                           Calendly, réservation par réservation.
                           `utmSource` reste le canal d'acquisition du lead (site ou meta),
                           il ne dit pas par où la personne a réservé. */
                        utmSource: isMeta ? 'meta' : 'site',
                        utmMedium: 'email',
                        utmCampaign: 'sequence-bienvenue'
                    }
                });
            }
            if (window.Calendly) { initCalendly(); }
            else { window.addEventListener('load', initCalendly); }
        })();
    </script>

</body>
</html>
